name: Validate SecureChat before Vercel deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securechat-main-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate before Vercel deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      # Vercel's GitHub integration performs the production deployment for main.
      # Keeping deployment out of this workflow avoids requiring a Vercel API
      # secret and prevents an empty credential from reaching the Vercel CLI.
